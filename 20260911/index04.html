<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>INDEX04</title>
</head>
<body>
    
    <!-- form(양식) 태그 -->
    <form
        action="서버 URL"
        method="post">
        
        <input type="text" placeholder="회원 ID 입력하세요"><br>
        <input type="password" placeholder="회원 PW 입력하세요"><br>
        <input type="email" placeholder="회원 mail 입력하세요"><br>
        <input type="checkbox" name="hobby">축구
        <input type="checkbox" name="hobby">배구
        <input type="checkbox" name="hobby">야구<br>
        <input type="radio" name="gender">여자
        <input type="radio" name="gender">남자<br>
        <input type="number" placeholder="회원 나이를 입력하세요"><br>
        <input type="file"><br>
        <input type="date"><br>
        <input type="datetime-local"><br>
        <input type="radio" name="gender">여자<br>
        <input type="radio" name="gender">남자
        <input type="color"><br>
        <input type="range"><br>
        <input type="button" value="회원가입"><br>  
        <input type="reset" value="초기화"><br> 
        
        <select>
            <option>한국</option>
            <option>미국</option>
            <option>일본</option>
            <option>중국</option>
            <option>프랑스</option>
        </select>
        <br>
        
        <textarea></textarea>
    
    </form>
    
</body>
</html>
